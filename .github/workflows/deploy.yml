name: Deploy to production

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, mysql, redis, bcmath, gd, intl, zip

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Install dependencies (for lint only)
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Lint PHP syntax
        run: find app config routes database -name "*.php" -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_HOST_KEY }}" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 $DEPLOY_USER@$DEPLOY_HOST \
            'bash /var/www/carhub/bin/deploy.sh master'

      - name: Health check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' https://api.carhubrasil.com.br/api/health || echo 000)
            if [ "$code" = "200" ]; then
              echo "Health OK (HTTP $code)"
              exit 0
            fi
            echo "Attempt $i: HTTP $code — retrying in 3s"
            sleep 3
          done
          echo "Health check FAILED after 5 attempts"
          exit 1

      - name: Rollback on failure
        if: failure()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 $DEPLOY_USER@$DEPLOY_HOST \
            'bash /var/www/carhub/bin/rollback.sh' || true
